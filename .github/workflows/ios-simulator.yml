name: iOS simulator build (cloud Mac)
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-simulator.yml'
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile unsigned iOS Simulator app
        working-directory: ios
        run: |
          xcodebuild -project NightCityGPS.xcodeproj -scheme NightCityGPS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightCityGPS-iOS-Simulator-UNSIGNED-NOT-FOR-IPHONE
          path: ios/build/Build/Products/Debug-iphonesimulator/NightCityGPS.app
          if-no-files-found: error
